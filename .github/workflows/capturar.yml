name: Gerar captura técnica

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL completa a capturar"
        required: true
        type: string
      nome:
        description: "Nome opcional para a pasta da captura"
        required: false
        type: string
      branch:
        description: "Branch de preservação"
        required: true
        default: "main"
        type: string

permissions:
  contents: write

jobs:
  capturar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o projeto
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Gerar e preservar a captura
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python PDF_printer.py
          --url "${{ inputs.url }}"
          --name "${{ inputs.nome }}"
          --output-dir capturas
          --repo "${{ github.repository }}"
          --branch "${{ inputs.branch }}"
